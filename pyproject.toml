[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proofmesh"
version = "0.1.0"
description = "Intent, intervention, and evidence control layer for AI-assisted software development"
readme = "README.md"
# TRD §2 target runtime specification. Dual-supported on Python 3.12 and 3.14.
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-or-later"
authors = [{ name = "ProofMesh Contributors" }]
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
    "mcp>=2.3.0,<3.0.0",
]

[project.scripts]
proofmesh = "proofmesh.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"proofmesh.storage.migrations" = ["*.sql"]
"proofmesh.resources" = ["*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
